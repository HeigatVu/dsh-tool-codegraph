# @ducvu/dsh-tool-codegraph — bundle patch layer (local editable fork of
# @m1khal3v/dsh-tool-codegraph).
#
# Inserts one plugin row that mounts the CodeGraph tool set. Tools shell out to
# the local `codegraph` CLI (https://github.com/colbymchenry/codegraph) through
# ctx.shell; override the binary via the `executable` config key to point at a
# modified build that is not on PATH.
- insert:
    - id: tool-codegraph
      name: '@ducvu/dsh-tool-codegraph'
      config:
        executable: codegraph
